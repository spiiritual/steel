# A steel instance with its own desktop.
#
#   docker compose up -d                 start (or update: pull first)
#   docker compose run --rm steel config set telegram-allowed-users 123456789
#   docker compose exec steel steel usage
#   docker compose logs -f
#   open http://localhost:6080           watch or take over the desktop
#
# Update: send /update in Telegram (steel also says when a release is
# out); /rollback goes back. The updater service below does the work: it
# pulls the release's signed image, lets steel finish its running work
# (stop_grace_period covers its 1m drain), swaps the container, and
# puts the old one back if the new one doesn't stay up. By hand:
# docker compose pull && docker compose up -d. Everything that lasts is
# in the volume.
#
# Secrets: put OPENAI_API_KEY and TELEGRAM_BOT_TOKEN in a .env file beside
# this one (git ignores it), or save them in the volume with
# `docker compose run --rm steel config set openai-api-key`.
services:
  steel:
    image: ghcr.io/spiiritual/steel:latest
    build: .
    hostname: steel
    restart: unless-stopped
    stop_grace_period: 90s
    shm_size: 2gb
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      STEEL_VNC_PASSWORD: ${STEEL_VNC_PASSWORD:-}
      STEEL_UPDATER: http://updater:8086
    ports:
      # Whoever reaches this port controls the desktop. Keep it on
      # localhost; from elsewhere use an SSH tunnel or Tailscale, and set
      # STEEL_VNC_PASSWORD.
      - "127.0.0.1:6080:6080"
    volumes:
      - home:/home/steel

  # Replaces steel's container with a new release when steel asks. It
  # holds the Docker socket (root on the host), so it runs no model and
  # publishes no port; steel reaches it on the compose network. Its API
  # takes no arguments: whatever reaches it, the agent included, can only
  # move steel to the newest signed release or back to the previous one.
  # It updates itself with `docker compose pull && docker compose up -d`.
  updater:
    image: ghcr.io/spiiritual/steel:latest
    command: ["updater"]
    user: root
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  home:

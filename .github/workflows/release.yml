# Publishes a signed release when a version tag (v1.2.3) is pushed.
#
# Assets: one binary per platform (steel-<os>-<arch>), checksums.txt with
# their SHA-256 sums, and checksums.txt.minisig, a minisign signature by the
# release key whose public half is built into steel. `steel update` checks
# the signature, then the checksum, before installing anything.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push the image to ghcr.io
  id-token: write # sign the image with cosign, keyless

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/steel-$os-$arch" ./cmd/steel
          done
          cd dist && sha256sum steel-* > checksums.txt

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          sudo apt-get install -y minisign
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/checksums.txt -t "steel $VERSION"
          rm -f "$key"

      # The image runs the binaries just signed (STEEL_SOURCE=dist), so a
      # container and `steel update` get the same steel. QEMU runs the
      # arm64 image's apt and npm steps.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            STEEL_SOURCE=dist
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - uses: sigstore/cosign-installer@v4
      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@$DIGEST"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes
